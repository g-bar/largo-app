services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: largo
      POSTGRES_PASSWORD: largo
      POSTGRES_DB: largo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U largo -d largo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
